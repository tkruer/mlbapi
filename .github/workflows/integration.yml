name: Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    name: Live API Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run live integration tests
        run: make integration-test
